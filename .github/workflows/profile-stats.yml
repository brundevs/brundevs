name: Atualizar estatísticas do perfil

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: profile-stats
  cancel-in-progress: false

jobs:
  cards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Cartão claro
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        with:
          card: stats
          options: username=brundevs&show_icons=true&hide_rank=true&hide=contribs&locale=pt-br&title_color=2563EB&icon_color=2563EB&text_color=334155&bg_color=FFFFFF&border_color=E2E8F0&custom_title=Atividade%20p%C3%BAblica&include_all_commits=true
          path: profile/stats-light.svg
          core_version: 2.2.1
          fail_on_error: "true"
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Cartão escuro
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        with:
          card: stats
          options: username=brundevs&show_icons=true&hide_rank=true&hide=contribs&locale=pt-br&title_color=60A5FA&icon_color=60A5FA&text_color=CBD5E1&bg_color=0D1117&border_color=30363D&custom_title=Atividade%20p%C3%BAblica&include_all_commits=true
          path: profile/stats-dark.svg
          core_version: 2.2.1
          fail_on_error: "true"
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Salvar cartões válidos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/stats-light.svg profile/stats-dark.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Atualiza cartões de estatísticas públicas"
          git pull --rebase origin main
          git push origin HEAD:main
